<!DOCTYPE html>

<head>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard','Apple SD Gothic Neo',sans-serif; background:#f5f4f0; color:#1a1a18; min-height:100vh; padding:1.5rem 1rem; }
  .container { max-width:720px; margin:0 auto; }

  .topic-btn { background:#fff; border:0.5px solid #d3d1c7; border-radius:12px; padding:0.85rem 0.9rem; text-align:left; cursor:pointer; transition:all 0.15s; font-size:0.86rem; line-height:1.35; color:#1a1a18; }

  .progress-bar-wrap { background:#d3d1c7; border-radius:99px; height:6px; margin-bottom:0.5rem; }

  .wrong-only-banner { background:#FAECE7; border:0.5px solid #F0997B; border-radius:10px; padding:0.7rem 1rem; font-size:0.85rem; color:#4A1B0C; margin-bottom:1rem; display:none; }
  .wrong-only-banner.show { display:block; }
  .quiz-card { background:#fff; border:0.5px solid #d3d1c7; border-radius:14px; padding:1.5rem; margin-bottom:1.1rem; }
  .q-num { font-size:0.72rem; font-weight:600; color:#0F6E56; background:#E1F5EE; padding:3px 10px; border-radius:99px; display:inline-block; margin-bottom:0.7rem; }

  .opt-btn { background:#fff; border:0.5px solid #b4b2a9; border-radius:10px; padding:0.7rem 1rem; font-size:0.9rem; line-height:1.5; text-align:left; cursor:pointer; transition:all 0.15s; color:#1a1a18; }
  .opt-btn:hover:not(:disabled) { background:#f1efe8; border-color:#888780; }
  .opt-btn.correct { background:#E1F5EE; border-color:#1D9E75; color:#085041; }
  .opt-btn.wrong { background:#FAECE7; border-color:#993C1D; color:#4A1B0C; }
  .opt-btn.reveal { background:#E1F5EE; border-color:#1D9E75; color:#085041; }
  .opt-btn:disabled { cursor:default; }
  .explanation { margin-top:0.9rem; padding:0.85rem 1rem; background:#f1efe8; border-radius:10px; font-size:0.86rem; line-height:1.7; color:#2c2c2a; display:none; }
  .explanation.show { display:block; }
  .explanation strong { color:#0F6E56; }
  .keyword-chip { display:inline-block; background:#E6F1FB; color:#0C447C; font-size:0.72rem; padding:2px 9px; border-radius:99px; margin:2px; }
  .result-panel { background:#fff; border:0.5px solid #d3d1c7; border-radius:14px; padding:2rem; text-align:center; display:none; }
  .result-panel.show { display:block; }
  .score-circle { width:100px; height:100px; border-radius:50%; background:#E1F5EE; border:3px solid #1D9E75; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 1rem; }
  .score-circle .num { font-size:2rem; font-weight:700; color:#0F6E56; line-height:1; }
  .score-circle .denom { font-size:0.8rem; color:#1D9E75; }
  .result-panel h2 { font-size:1.15rem; margin-bottom:0.5rem; }
  .result-panel p { font-size:0.88rem; color:#5f5e5a; margin-bottom:1.5rem; }
  .btn-row { display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; }
  .btn { padding:0.55rem 1.2rem; border-radius:8px; font-size:0.85rem; cursor:pointer; border:0.5px solid #b4b2a9; background:#fff; color:#1a1a18; transition:background 0.15s; }
  .btn:hover { background:#f1efe8; }
  .btn.primary { background:#0F6E56; color:#fff; border-color:#0F6E56; }
  .btn.primary:hover { background:#085041; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>한국사 19선 핵심 퀴즈</h1>
    <p>모범답안 내용 이해 + 필수 키워드 암기 확인 · 4지선다</p>
  </header>

  <!-- 주제 선택 메뉴 -->
  <div class="menu show" id="menu">
    <p class="menu-title">주제를 선택하세요 · 각 10문항 (총 190문항)</p>
    <div class="topic-grid" id="topicGrid"></div>

  <!-- 퀴즈 영역 -->

      <div class="score-circle"><span class="num" id="scoreNum">0</span><span class="denom" id="scoreDenom">/ 10</span></div>

        <button class="btn" onclick="goMenu()">주제 선택</button>
      </div>
    </div>
  </div>
</div>

<script>

let currentQuestions = [], answered = [], score = 0, wrongIds = [], curTopicName = "";

// ── 주제 메뉴 렌더 ──
function renderMenu() {
  const grid = document.getElementById('topicGrid');
  let html = TOPICS.map((t, ti) =>
    `<button class="topic-btn" onclick="startTopic(${ti})">
       <span class="tn">${t.name}</span>
       <span class="meta" id="meta_${ti}">10문항</span>
     </button>`
  ).join('');
  html += `<button class="topic-btn all-btn" onclick="startAll()">전체 190문항 이어서 풀기</button>`;
  grid.innerHTML = html;
}

function startTopic(ti) {
  curTopicName = TOPICS[ti].name;
  init(TOPICS[ti].questions.map(q => ({...q})), false);
}
function startAll() {
  curTopicName = "전체 190문항";
  const all = [];
  TOPICS.forEach(t => t.questions.forEach(q => all.push({...q})));
  init(all, false);
}

function goMenu() {
  document.getElementById('quizWrap').className = 'quiz-wrap';
  document.getElementById('menu').className = 'menu show';
  window.scrollTo({top:0,behavior:'smooth'});
}

function init(questions, wrongMode) {
  currentQuestions = questions;
  answered = new Array(questions.length).fill(false);
  score = 0; wrongIds = [];
  document.getElementById('menu').className = 'menu';
  document.getElementById('quizWrap').className = 'quiz-wrap show';
  document.getElementById('curTopic').textContent = curTopicName;
  document.getElementById('resultPanel').className = 'result-panel';
  document.getElementById('wrongBanner').className = wrongMode ? 'wrong-only-banner show' : 'wrong-only-banner';
  document.getElementById('scoreDenom').textContent = '/ ' + questions.length;
  renderQuiz();
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuiz() {
  document.getElementById('quizArea').innerHTML =
    currentQuestions.map((q,i) => renderCard(q,i)).join('');
}

function renderCard(q,i) {

    `<button class="opt-btn" id="opt_${i}_${oi}" onclick="choose(${i},${oi})">${String.fromCharCode(9312+oi)} ${o}</button>`
  ).join('');
  const kwHtml = q.keywords.map(k => `<span class="keyword-chip">${k}</span>`).join('');
  return `
  <div class="quiz-card" id="card_${i}">
    <span class="q-num">Q${i+1}</span>
    <p class="q-text">${q.q}</p>
    <div class="options">${optsHtml}</div>
    <div class="explanation" id="exp_${i}">
      <p>${q.exp}</p>
      <div style="margin-top:0.5rem;">${kwHtml}</div>
    </div>
  </div>`;
}

function choose(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;
  const q = currentQuestions[qIdx];
  const isCorrect = optIdx === q.ans;
  if (isCorrect) score++; else wrongIds.push(qIdx);
  for (let i=0;i<q.opts.length;i++){
    const btn = document.getElementById(`opt_${qIdx}_${i}`);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add(isCorrect && i===optIdx ? 'correct':'reveal');
    if (!isCorrect && i===optIdx) btn.classList.add('wrong');
  }
  document.getElementById(`exp_${qIdx}`).classList.add('show');
  updateProgress();
  if (answered.every(Boolean)) setTimeout(showResult, 500);
}

function updateProgress() {
  const done = answered.filter(Boolean).length, total = currentQuestions.length;
  document.getElementById('pbar').style.width = (done/total*100)+'%';
  document.getElementById('plabel').textContent = `${done} / ${total} 완료`;
}

function showResult() {
  const total = currentQuestions.length, pct = Math.round(score/total*100);
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = '/ ' + total;
  const titles = ['다시 도전해 보세요','기초를 다져봅시다','조금 더 공부가 필요해요','잘 이해하고 있어요','거의 완벽해요','만점! 완벽합니다'];
  const msgs = ['모범답안의 키워드를 다시 정리해 보세요.','필수 키워드 표를 먼저 암기해 보세요.','틀린 문제의 해설을 꼼꼼히 읽어보세요.','오답 문제를 한 번 더 풀어보면 완성됩니다.','핵심 키워드를 시험장에서도 떠올릴 수 있을 거예요.','이 주제는 완벽하게 정복했습니다!'];
  const idx = Math.min(Math.floor(pct/20),5);
  document.getElementById('resultTitle').textContent = titles[idx];
  document.getElementById('resultMsg').textContent = msgs[idx];
  document.getElementById('resultPanel').className = 'result-panel show';
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth'});
}

function retryWrong() {
  if (wrongIds.length === 0) { alert('모든 문제를 맞혔습니다!'); return; }
  const wrongQs = wrongIds.map(i => currentQuestions[i]);
  init(wrongQs, true);
}
function restartTopic() {
  init(currentQuestions.map(q => ({...q})), false);
}

renderMenu();
</script>
</body>
</html>
